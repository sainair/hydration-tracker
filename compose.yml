services:
  dev:
    build: .
    image: hydration-tracker:dev
    ports:
      - 5173:5173
    volumes:
      - .:/app
      - /app/node_modules

  db-server:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  hydration-api:
    build:
      ./backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-server:5432/${POSTGRES_DB}
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app
    depends_on:
      db-server:
        condition: service_healthy
      
volumes:
  db-data:
