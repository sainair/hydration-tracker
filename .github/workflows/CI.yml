name: CI

on:
    push:
        branches: [main, Dev]
    pull_request:

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: 
                node-version: "22"
                cache: npm

            - run: npm ci
            - run: npm run build

    backend:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hydration_test
            TEST_DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hydration_test
            SECRET_KEY: placeholder-key123
            TIMEZONE: Asia/Qatar
        services:
          postgres:
            image: postgres:18
            env:
              POSTGRES_PASSWORD: postgres
              POSTGRES_DB: hydration_test
            ports:
              - 5432:5432
            options: >-
              --health-cmd pg_isready --health-interval 10s
              --health-timeout 5s --health-retries 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: pip

            - run: pip install -r requirements.txt
              working-directory: backend

            - run: pytest
              working-directory: backend